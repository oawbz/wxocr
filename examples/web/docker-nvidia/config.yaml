# 默认仅本机可访问。对外监听可改为 0.0.0.0 或 ::。
listen_address: 0.0.0.0
listen_port: 7676
# 在网页填写此值；部署时请替换成自己的随机 Token。
token: wxocr-local-demo-change-this-token
# 整个上传、解码、识别、预览流程最多允许两个任务；忙时立即返回 429。
# 两个独立常驻模型实例实现并行，各自完成启动预热。
max_concurrent_tasks: 2
engine_workers: 2
# 全服务有效鉴权请求的令牌桶速率，启动时允许同数突发；0 表示关闭此项。
requests_per_minute: 0
# true：启动时加载并常驻；false：每次识别时加载，结束后释放。
model_resident: true
# 在监听前预热所有检测尺寸、文字行宽度和段落模型。
startup_warmup: true
# 相对路径以此配置文件所在目录为基准。
models_dir: ./models
# 空值按操作系统选择 ../../runtime 下的动态库；Linux 需提供适配库。
runtime_library: ./runtime/libort-cuda.so
log_enabled: false
debug: false
